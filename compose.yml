name: drive-backup

volumes:
  drive-backup-data:
    name: drive-backup-data

x-base: &base
  image: minecraft-drive-backup:latest
  restart: always
  user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:size=64m,mode=1777
  env_file: ./.env
  logging:
    driver: json-file
    options: {max-size: "5m", max-file: "3"}

services:
  drive-backup:
    <<: *base
    build: .
    container_name: drive-backup
    mem_limit: 192m
    memswap_limit: 192m
    cpus: 0.25
    environment:
      HOME: /tmp
      SFTP_PASSWORD: ""
      RCON_PASSWORD: ""
      MARIADB_PASSWORD: ""
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - drive-backup-data:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/data/heartbeat')<120 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

  drive-backup-worker:
    <<: *base
    container_name: drive-backup-worker
    depends_on: [drive-backup]
    entrypoint: ["ionice", "-c", "3", "chrt", "-i", "0", "nice", "-n", "19", "python3", "-m", "drivebackup.engine", "serve"]
    cpus: 1.0
    cpu_shares: 2
    oom_score_adj: 1000
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      HOME: /tmp
      DISCORD_BOT_TOKEN: ""
    volumes:
      - drive-backup-data:/data
      - ${SOURCE_HOST_PATH:-./source}:/source:ro
      - ./rclone.conf:/run/secrets/rclone.conf:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/data/worker.heartbeat')<300 else 1)"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 90s
